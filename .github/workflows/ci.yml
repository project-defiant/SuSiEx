name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native C++ tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: bash run_tests.sh

  python:
    name: Python tests and type check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: native
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra test
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ty check src/susiex_cli --output-format=github

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra test
      - run: uv run --frozen ruff check src/susiex_cli tests/python
      - run: uv run --frozen ruff format --check src/susiex_cli tests/python

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: susiex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm susiex:ci --help

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Make tests script executable
        run: chmod +x ./run_tests.sh

      - name: Run C++ test suite
        run: ./run_tests.sh
        env:
          CI: true

  python-build:
    name: Build Python extension and run Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev

      - name: Create venv
        run: python -m venv .venv && source .venv/bin/activate && python -m pip install --upgrade pip

      - name: Install Python deps
        run: |
          source .venv/bin/activate
          pip install pybind11 numpy pytest

      - name: Build and install extension
        run: |
          source .venv/bin/activate
          pip install .

      - name: Run Python tests
        run: |
          source .venv/bin/activate
          pytest -q tests/python
        env:
          CI: true

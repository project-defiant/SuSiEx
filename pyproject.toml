[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.10", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "susiex"
version = "0.1.0"
description = "Python interface for the SuSiEx cross-ancestry fine-mapping implementation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "loguru>=0.7",
    "numpy>=2.0",
    "pydantic>=2.0",
    "typer>=0.16",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "ruff>=0.11",
    "ty>=0.0.1",
]

[project.scripts]
susiex = "susiex_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
